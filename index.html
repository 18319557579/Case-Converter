<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Converter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --bg-glow: #132441;
      --surface: #131e30;
      --surface-strong: #1b2940;
      --surface-input: #0d1728;
      --surface-output: #101c2f;
      --surface-hover: #243650;
      --text: #e6edf7;
      --muted: #9eacc3;
      --border: #34445f;
      --border-hover: #6487bd;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --accent-soft: #274b7a;
      --text-on-accent: #ffffff;
      --focus: #93c5fd;
      --green: #80dcb0;
      --green-soft: #15382f;
      --green-border: #34765d;
      --amber: #f4bf75;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.025);
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    ::selection {
      background: var(--accent-soft);
      color: var(--text);
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, var(--bg-glow) 0, transparent 340px),
        var(--bg);
      color: var(--text);
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 26px 0 32px;
    }

    .app-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 3vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .header-meta {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
    }

    .converter-stack {
      display: grid;
      gap: 16px;
    }

    .converter {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .converter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .converter-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .active-case {
      min-width: 136px;
      padding: 7px 10px;
      border-radius: var(--radius);
      background: var(--green-soft);
      color: var(--green);
      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    .format-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .case-button {
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      padding: 8px 6px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, box-shadow 140ms ease;
    }

    .case-button:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
    }

    .case-button:focus-visible,
    .icon-button:focus-visible,
    textarea:focus {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .case-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--text-on-accent);
      box-shadow: 0 8px 22px rgba(37, 99, 235, 0.24);
    }

    .case-button[aria-pressed="true"]:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .text-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
    }

    .field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    @media (min-width: 821px) {
      .field {
        grid-template-rows: auto minmax(156px, 1fr) 18px;
      }
    }

    .field-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
    }

    label {
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .field-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 86px;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-strong);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      padding: 8px 10px;
      transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
    }

    .icon-button:hover {
      border-color: var(--border-hover);
      background: var(--surface-hover);
    }

    .icon-button svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .copy-button.copied {
      border-color: var(--green-border);
      background: var(--green-soft);
      color: var(--green);
    }

    textarea {
      width: 100%;
      min-height: 156px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-input);
      color: var(--text);
      caret-color: var(--focus);
      line-height: 1.45;
      padding: 12px;
      tab-size: 2;
    }

    textarea[readonly] {
      background: var(--surface-output);
    }

    textarea:hover {
      border-color: var(--border-hover);
    }

    textarea:focus {
      border-color: var(--focus);
    }

    .status {
      min-height: 18px;
      color: var(--amber);
      font-size: 12px;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 20px, 720px);
        padding-top: 18px;
      }

      .app-header,
      .converter-header {
        align-items: stretch;
        flex-direction: column;
      }

      .header-meta,
      .active-case {
        width: fit-content;
        white-space: normal;
      }

      .format-grid,
      .text-grid {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 130px;
      }
    }

    @media (max-width: 460px) {
      .converter {
        padding: 12px;
      }

      .field-top {
        align-items: stretch;
        flex-direction: column;
      }

      .field-actions {
        justify-content: flex-start;
      }

      .icon-button {
        min-width: 78px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Case Converter</h1>
      <div class="header-meta">Local Offline Tool</div>
    </header>

    <section class="converter-stack" aria-label="Case converters">
      <article class="converter" data-converter="1">
        <div class="converter-header">
          <h2 class="converter-title">Converter 1</h2>
          <div class="active-case" data-active-case>lowercase</div>
        </div>
        <div class="format-grid" data-case-buttons></div>
        <div class="text-grid">
          <div class="field">
            <div class="field-top">
              <label for="input-1">Input Text</label>
              <div class="field-actions">
                <button class="icon-button clear-button" type="button" data-clear title="Clear Input Text">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4-4 9-9 4 4-9 9Z"></path>
                    <path d="m14 6 4 4"></path>
                    <path d="M12 21h9"></path>
                  </svg>
                  <span>Clear</span>
                </button>
              </div>
            </div>
            <textarea id="input-1" data-input spellcheck="false"></textarea>
          </div>
          <div class="field">
            <div class="field-top">
              <label for="output-1">Output Text</label>
              <div class="field-actions">
                <button class="icon-button copy-button" type="button" data-copy title="Copy Output Text">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="14" x="8" y="8" rx="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                  </svg>
                  <span data-copy-label>Copy</span>
                </button>
              </div>
            </div>
            <textarea id="output-1" data-output readonly spellcheck="false"></textarea>
            <div class="status" data-status aria-live="polite"></div>
          </div>
        </div>
      </article>

      <article class="converter" data-converter="2">
        <div class="converter-header">
          <h2 class="converter-title">Converter 2</h2>
          <div class="active-case" data-active-case>lowercase</div>
        </div>
        <div class="format-grid" data-case-buttons></div>
        <div class="text-grid">
          <div class="field">
            <div class="field-top">
              <label for="input-2">Input Text</label>
              <div class="field-actions">
                <button class="icon-button clear-button" type="button" data-clear title="Clear Input Text">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m7 21-4-4 9-9 4 4-9 9Z"></path>
                    <path d="m14 6 4 4"></path>
                    <path d="M12 21h9"></path>
                  </svg>
                  <span>Clear</span>
                </button>
              </div>
            </div>
            <textarea id="input-2" data-input spellcheck="false"></textarea>
          </div>
          <div class="field">
            <div class="field-top">
              <label for="output-2">Output Text</label>
              <div class="field-actions">
                <button class="icon-button copy-button" type="button" data-copy title="Copy Output Text">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="14" height="14" x="8" y="8" rx="2"></rect>
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
                  </svg>
                  <span data-copy-label>Copy</span>
                </button>
              </div>
            </div>
            <textarea id="output-2" data-output readonly spellcheck="false"></textarea>
            <div class="status" data-status aria-live="polite"></div>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const CASES = [
      { id: "lowercase", label: "lowercase" },
      { id: "uppercase", label: "UPPERCASE" },
      { id: "camel", label: "camelCase" },
      { id: "capital", label: "Capital Case" },
      { id: "constant", label: "CONSTANT_CASE" },
      { id: "dot", label: "dot.case" },
      { id: "kebab", label: "kebab-case" },
      { id: "no", label: "no case" },
      { id: "pascal", label: "PascalCase" },
      { id: "pascal-snake", label: "Pascal_Snake_Case" },
      { id: "path", label: "path/case" },
      { id: "sentence", label: "Sentence case" },
      { id: "snake", label: "snake_case" },
      { id: "swap", label: "sWAP cASE" },
      { id: "train", label: "Train-Case" }
    ];

    const DEFAULT_CASE = "lowercase";

    function splitWords(text) {
      const spaced = text
        .replace(/([\p{Ll}\p{Nd}])(\p{Lu})/gu, "$1 $2")
        .replace(/(\p{Lu}+)(\p{Lu}\p{Ll})/gu, "$1 $2")
        .replace(/(\p{Nd})(\p{L})/gu, "$1 $2");
      return spaced.match(/[\p{L}\p{N}]+/gu) || [];
    }

    function lowerWord(word) {
      return word.toLocaleLowerCase();
    }

    function titleWord(word) {
      const letters = Array.from(lowerWord(word));
      if (letters.length === 0) return "";
      return letters[0].toLocaleUpperCase() + letters.slice(1).join("");
    }

    function swapCase(text) {
      return Array.from(text).map((char) => {
        const lower = char.toLocaleLowerCase();
        const upper = char.toLocaleUpperCase();
        if (lower === upper) return char;
        return char === lower ? upper : lower;
      }).join("");
    }

    function joinLower(words, separator) {
      return words.map(lowerWord).join(separator);
    }

    function convertCase(text, caseId) {
      if (!text) return "";

      if (caseId === "lowercase") return text.toLocaleLowerCase();
      if (caseId === "uppercase") return text.toLocaleUpperCase();
      if (caseId === "swap") return swapCase(text);

      const words = splitWords(text);
      if (words.length === 0) return "";

      switch (caseId) {
        case "camel":
          return words
            .map((word, index) => index === 0 ? lowerWord(word) : titleWord(word))
            .join("");
        case "capital":
          return words.map(titleWord).join(" ");
        case "constant":
          return joinLower(words, "_").toLocaleUpperCase();
        case "dot":
          return joinLower(words, ".");
        case "kebab":
          return joinLower(words, "-");
        case "no":
          return joinLower(words, " ");
        case "pascal":
          return words.map(titleWord).join("");
        case "pascal-snake":
          return words.map(titleWord).join("_");
        case "path":
          return joinLower(words, "/");
        case "sentence": {
          const normalized = joinLower(words, " ");
          const chars = Array.from(normalized);
          return chars.length ? chars[0].toLocaleUpperCase() + chars.slice(1).join("") : "";
        }
        case "snake":
          return joinLower(words, "_");
        case "train":
          return words.map(titleWord).join("-");
        default:
          return text;
      }
    }

    function getStoredCase(converterId) {
      const stored = localStorage.getItem(`caseConverter.${converterId}.selectedCase`);
      return CASES.some((item) => item.id === stored) ? stored : DEFAULT_CASE;
    }

    function setStatus(root, message) {
      const status = root.querySelector("[data-status]");
      status.textContent = message;
      window.clearTimeout(status.statusTimer);
      if (message) {
        status.statusTimer = window.setTimeout(() => {
          status.textContent = "";
        }, 1400);
      }
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const helper = document.createElement("textarea");
      helper.value = text;
      helper.setAttribute("readonly", "");
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      helper.style.pointerEvents = "none";
      document.body.appendChild(helper);
      helper.select();
      const ok = document.execCommand("copy");
      helper.remove();
      if (!ok) throw new Error("Copy failed");
    }

    function initConverter(root) {
      const converterId = root.dataset.converter;
      const input = root.querySelector("[data-input]");
      const output = root.querySelector("[data-output]");
      const activeCase = root.querySelector("[data-active-case]");
      const buttonsContainer = root.querySelector("[data-case-buttons]");
      const copyButton = root.querySelector("[data-copy]");
      const copyLabel = root.querySelector("[data-copy-label]");
      let selectedCase = getStoredCase(converterId);

      function renderButtons() {
        buttonsContainer.innerHTML = "";
        CASES.forEach((caseItem) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "case-button";
          button.textContent = caseItem.label;
          button.dataset.caseId = caseItem.id;
          button.setAttribute("aria-pressed", String(caseItem.id === selectedCase));
          button.addEventListener("click", () => selectCase(caseItem.id));
          buttonsContainer.appendChild(button);
        });
      }

      function renderOutput() {
        const selected = CASES.find((caseItem) => caseItem.id === selectedCase) || CASES[0];
        activeCase.textContent = selected.label;
        output.value = convertCase(input.value, selectedCase);
      }

      function selectCase(caseId) {
        selectedCase = caseId;
        localStorage.setItem(`caseConverter.${converterId}.selectedCase`, selectedCase);
        root.querySelectorAll("[data-case-id]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.caseId === selectedCase));
        });
        renderOutput();
      }

      root.querySelector("[data-clear]").addEventListener("click", () => {
        input.value = "";
        output.value = "";
        setStatus(root, "");
        input.focus();
      });

      copyButton.addEventListener("click", async () => {
        try {
          await copyText(output.value);
          copyButton.classList.add("copied");
          copyLabel.textContent = "Copied";
          setStatus(root, "Copied");
          window.clearTimeout(copyButton.copyTimer);
          copyButton.copyTimer = window.setTimeout(() => {
            copyButton.classList.remove("copied");
            copyLabel.textContent = "Copy";
          }, 1200);
        } catch (error) {
          setStatus(root, "Copy failed");
        }
      });

      input.addEventListener("input", renderOutput);
      renderButtons();
      renderOutput();
    }

    document.querySelectorAll("[data-converter]").forEach(initConverter);
  </script>
</body>
</html>
